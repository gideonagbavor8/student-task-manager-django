{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>

    <div class="container">
        <h1>Add a New Task</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Save Task</button>
        </form>

        <a href="{% url 'task_list' %}">Back to Tasks</a>
    </div>

</body>
</html>
