<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>
</head>
<body>
    <h1>Student Task Manager</h1>

    <a href="{% url 'add_task' %}">Add New Task</a>

    <h2>My Tasks</h2>

    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    <strong>{{ task.title }}</strong>
                    <p>{{ task.description }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No tasks have been added yet.</p>
    {% endif %}
</body>
</html>
